<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Generate a<br><span class="highlight">random password</span></h1>
        <p class="subtitle">Never use an insecure password again.</p>
        
        <button id="generateBtn" class="generate-btn">Generate passwords</button>
        
        <div class="password-container">
            <div class="password" id="password1">
                <span class="copy-hint">📋 Click to copy</span>
            </div>
            <div class="password" id="password2">
                <span class="copy-hint">📋 Click to copy</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
